# Celeris control tower - frozen backend data contract (Phase F), version 1.0
#
# The frontend and the API read ONLY the datasets below. Every dataset is regenerated by
# `python run_pipeline.py` (stage in `stage`); tests/test_contract.py checks that each file
# exists, has every listed column with a compatible type and a unique primary key.
#
# Types: string | month (YYYY-MM string) | int | float | bool | json
# Units are parts (pieces) unless stated. Forecast = model mean; P10/P50/P90 = quantiles.
version: "1.0"
frozen: "2026-11-21"
history_end: "2026-10"
forecast_window: ["2026-11", "2028-05"]

datasets:
  submission:
    path: outputs/final/submission.csv
    stage: final
    view: forecast
    description: Hackathon submission - one row per test.csv row, same order.
    primary_key: [Date, SKU_ID, Region]
    columns:
      Date: month
      SKU_ID: string
      Region: string
      Units_Sold_Forecast: int          # rounded model mean, >= 0, 0 outside launch / EOL

  forecast_detail:
    path: outputs/final/forecast_detail.csv
    stage: final
    view: forecast
    description: SKU x Region x Month forecast with calibrated bands and the rule that produced it.
    primary_key: [Date, SKU_ID, Region]
    columns:
      Date: month
      Year: int
      Month: int
      Product_Family: string
      Business_Unit: string
      SKU_ID: string
      SKU_Description: string
      Customer_Name: string
      Sales_Channel: string
      Region: string
      h: int                            # months ahead of 2026-10 (1..19)
      Forecast: float                   # model mean after lifecycle / event rules
      P10: float
      P50: float
      P90: float
      Units_Sold_Forecast: int
      method: string                    # e.g. "global LightGBM; run-down: 0.587 x normal level ..."

  forecast_hierarchy:
    path: outputs/final/forecast_hierarchy.csv
    stage: final
    view: forecast
    description: Coherent aggregates (exact sums of SKU forecasts) with level-specific bands.
    primary_key: [Level, Member, Date]
    columns:
      Level: string                     # total | family | region | channel | customer | family_region
      Member: string                    # "Total" or the group value(s) joined by " | "
      Date: month
      h: int
      Forecast: float
      P10: float
      P50: float
      P90: float

  history:
    path: outputs/final/history.csv
    stage: final
    view: forecast
    description: Monthly history 2019-01..2026-10 - shipped units, recovered demand and flags.
    primary_key: [Date, SKU_ID, Region]
    columns:
      Date: month
      SKU_ID: string
      Region: string
      Product_Family: string
      Customer_Name: string
      Sales_Channel: string
      Units_Sold: float                 # cleaned shipments (NaN = month missing)
      Demand: float                     # unconstrained demand (stockout / allocation recovered)
      Demand_Source: string             # observed | stockout_file | allocation_uplift | backorder_netted | missing
      Anomaly_Type: string              # "" = normal month
      Train_Weight: float               # 0 = excluded from the model target

  band_coverage:
    path: outputs/final/band_coverage.csv
    stage: final
    view: accuracy
    description: Leave-one-cutoff-out coverage of the aggregate P10-P90 bands (target 0.80).
    primary_key: [Level, Held_Out_Cutoff]
    columns:
      Level: string
      Held_Out_Cutoff: month
      Points: int
      Coverage_P10_P90: float

  backtest_metrics:
    path: outputs/final/backtest_metrics.json
    stage: final
    view: accuracy
    description: Selected model's 6-cutoff rolling-origin backtest (19-month horizon).
    format: json
    required_keys: [overall, by_cutoff, by_horizon_bucket, by_Product_Family, by_Region, by_Demand_Class,
                    by_Volume_Band, by_Lifecycle, family_month, total_month, seasonal_naive_overall]

  manifest:
    path: outputs/final/manifest.json
    stage: final
    view: all
    description: Selected model, reason, spec, features, backtest headline, validation status, file hashes.
    format: json
    required_keys: [selected_model, selection_reason, spec, features, backtest, validation, files_sha256_16]

  validation_report:
    path: outputs/final/validation_report.json
    stage: final
    view: all
    format: json
    required_keys: [status, checks, facts]

  experiment_registry:
    path: artifacts/registry/registry.csv
    stage: backtest experiments
    view: accuracy
    description: Champion vs every challenger on identical folds, with promotion verdicts.
    primary_key: [experiment]
    columns:
      experiment: string
      description: string
      WAPE: float
      Bias: float
      MAE: float
      RMSE: float
      WAPE_1-3m: float
      WAPE_4-6m: float
      WAPE_7-12m: float
      WAPE_13-19m: float
      WAPE_family_month: float
      WAPE_total_month: float
      verdict: string

  horizon_reliability:
    path: artifacts/reports/horizon_reliability.csv
    stage: robustness
    view: accuracy
    primary_key: [h]
    columns:
      h: int
      WAPE_series: float
      Bias_series: float
      WAPE_family_month: float
      WAPE_total_month: float

  reliability_tiers:
    path: artifacts/reports/reliability_tiers.csv
    stage: robustness
    view: accuracy
    primary_key: [Tier]
    columns:
      Tier: string
      Series: int
      Volume_share: float
      Median_WAPE: float

  macro_stress:
    path: artifacts/reports/macro_stress.csv
    stage: robustness
    view: planning
    primary_key: [Scenario]
    columns:
      Scenario: string
      Total_19m: int
      Total_vs_base_pct: float

  series_signals:
    path: outputs/intelligence/series_signals.csv
    stage: intelligence
    view: planning
    description: Per SKU x Region status, risk, reasons and recommendation.
    primary_key: [SKU_ID, Region]
    columns:
      SKU_ID: string
      Region: string
      Product_Family: string
      Customer_Name: string
      hist_last12: float
      fc_next12: float
      p10_next12: float
      p90_next12: float
      forecast_change_vs_last12: float
      growth_3m_yoy: float
      backtest_wape: float
      forecast_status: string           # HIGH_GROWTH | GROWTH | STABLE | DECLINE | SHARP_DECLINE | RAMPING | NEW_LAUNCH | END_OF_LIFE
      sustained_surge: bool
      sustained_decline: bool
      risk_score: float                 # 0..100
      risk_level: string                # HIGH | MEDIUM | LOW
      reason_codes: string              # "|"-separated codes
      recommendation: string
      p90_next6_planning: float         # suggested 6-month planning quantity

  exceptions:
    path: outputs/intelligence/exceptions.csv
    stage: intelligence
    view: planning
    description: Ranked planner exception list.
    primary_key: [SKU_ID, Region]
    columns:
      SKU_ID: string
      Region: string
      tier: string                      # ACT_NOW | REVIEW
      trigger: string
      priority_score: float
      units_at_stake_next12: float
      reason_codes: string
      recommendation: string

  market_signals:
    path: outputs/intelligence/market_signals.csv
    stage: intelligence
    view: planning
    primary_key: [Level, Member]
    columns:
      Level: string
      Member: string
      yoy_last3m: float
      yoy_last12m: float
      acceleration: float
      forecast_next12_vs_last12: float
      signal: string

  lifecycle_alerts:
    path: outputs/intelligence/lifecycle_alerts.csv
    stage: intelligence
    view: planning
    columns:
      Alert: string
      SKU_ID: string
      Date: month
      Detail: string

  interval_reliability:
    path: outputs/intelligence/interval_reliability.csv
    stage: intelligence
    view: accuracy
    primary_key: [Segment, Value]
    columns:
      Segment: string
      Value: string
      Rows: int
      Coverage_P10_P90: float

  intelligence_summary:
    path: outputs/intelligence/summary.json
    stage: intelligence
    view: planning
    format: json
    required_keys: [forecast_model, series, status_counts, risk_level_counts, exceptions, market_headline]

  anomaly_register:
    path: outputs/anomalies/anomaly_register.csv
    stage: anomalies
    view: anomalies
    description: Every flagged month - type, category, evidence and the action taken.
    columns:
      Date: month
      SKU_ID: string
      Region: string
      Product_Family: string
      Units_Shipped: float
      Demand: float
      Expected: float
      Type: string
      Category: string                  # stockout | spike | drop | real_event | gap | ...
      Detection: string
      Reason: string
      Action: string
      Confidence: string

  structural_register:
    path: outputs/anomalies/structural_register.csv
    stage: anomalies
    view: anomalies
    columns:
      Type: string
      Date: string                      # YYYY-MM, or YYYY for year-level ordering-cycle changes
      SKU_ID: string
      Region: string
      Detail: string
      Evidence: string
      Action: string

  event_impact:
    path: outputs/anomalies/event_impact.csv
    stage: anomalies
    view: anomalies
    primary_key: [Event_ID]
    columns:
      Event_ID: string
      Event_Type: string
      Description: string
      Shipped_Impact_Pct: float
      Demand_Impact_Pct: float
      Method: string
      Verdict: string

  dq_issue_log:
    path: outputs/quality/dq_issue_log.csv
    stage: clean
    view: data_quality
    description: Every data-quality correction (original -> corrected, rule applied).
    columns:
      file: string
      row_ref: string
      issue_type: string
      category: string
      field: string
      original: string
      corrected: string
      action: string
      rule: string

  dq_report:
    path: outputs/quality/dq_report.json
    stage: clean
    view: data_quality
    format: json

  run_report:
    path: outputs/quality/run_report.json
    stage: clean
    view: data_quality
    format: json
    required_keys: [validation_status]
