# Celeris control tower - frozen backend data contract (Phase F), version 1.0
#
# The frontend and the API read ONLY the datasets below. Every dataset is regenerated by
# `python run_pipeline.py` (stage in `stage`); tests/test_contract.py checks that each file
# exists, has every listed column with a compatible type and a unique primary key.
#
# Types: string | month (YYYY-MM string) | int | float | bool | json
# Units are parts (pieces) unless stated. Forecast = model mean; P10/P50/P90 = quantiles.
version: "1.0"
frozen: "2026-11-21"
history_end: "2026-10"
forecast_window: ["2026-11", "2028-05"]

datasets:
  submission:
    path: outputs/final/submission.csv
    stage: final
    view: forecast
    description: Hackathon submission - one row per test.csv row, same order.
    primary_key: [Date, SKU_ID, Region]
    columns:
      Date: month
      SKU_ID: string
      Region: string
      Units_Sold_Forecast: int          # rounded model mean, >= 0, 0 outside launch / EOL

  forecast_detail:
    path: outputs/final/forecast_detail.csv
    stage: final
    view: forecast
    description: SKU x Region x Month forecast with calibrated bands and the rule that produced it.
    primary_key: [Date, SKU_ID, Region]
    columns:
      Date: month
      Year: int
      Month: int
      Product_Family: string
      Business_Unit: string
      SKU_ID: string
      SKU_Description: string
      Customer_Name: string
      Sales_Channel: string
      Region: string
      h: int                            # months ahead of 2026-10 (1..19)
      Forecast: float                   # model mean after lifecycle / event rules
      P10: float
      P50: float
      P90: float
      Units_Sold_Forecast: int
      method: string                    # e.g. "global LightGBM; run-down: 0.587 x normal level ..."

  forecast_hierarchy:
    path: outputs/final/forecast_hierarchy.csv
    stage: final
    view: forecast
    description: Coherent aggregates (exact sums of SKU forecasts) with level-specific bands.
    primary_key: [Level, Member, Date]
    columns:
      Level: string                     # total | family | region | channel | customer | family_region
      Member: string                    # "Total" or the group value(s) joined by " | "
      Date: month
      h: int
      Forecast: float
      P10: float
      P50: float
      P90: float

  history:
    path: outputs/final/history.csv
    stage: final
    view: forecast
    description: Monthly history 2019-01..2026-10 - shipped units, recovered demand and flags.
    primary_key: [Date, SKU_ID, Region]
    columns:
      Date: month
      SKU_ID: string
      Region: string
      Product_Family: string
      Customer_Name: string
      Sales_Channel: string
      Units_Sold: float                 # cleaned shipments (NaN = month missing)
      Demand: float                     # unconstrained demand (stockout / allocation recovered)
      Revenue_shipped: float            # cleaned invoiced revenue, USD
      Revenue_unconstrained: float      # recovered demand x that month's price, USD
      Demand_Source: string             # observed | stockout_file | allocation_uplift | backorder_netted | missing
      Anomaly_Type: string              # "" = normal month
      Train_Weight: float               # 0 = excluded from the model target

  band_coverage:
    path: outputs/final/band_coverage.csv
    stage: final
    view: accuracy
    description: Leave-one-cutoff-out coverage of the aggregate P10-P90 bands (target 0.80).
    primary_key: [Level, Held_Out_Cutoff]
    columns:
      Level: string
      Held_Out_Cutoff: month
      Points: int
      Coverage_P10_P90: float

  backtest_metrics:
    path: outputs/final/backtest_metrics.json
    stage: final
    view: accuracy
    description: Selected model's 6-cutoff rolling-origin backtest (19-month horizon).
    format: json
    required_keys: [overall, by_cutoff, by_horizon_bucket, by_Product_Family, by_Region, by_Demand_Class,
                    by_Volume_Band, by_Lifecycle, family_month, total_month, seasonal_naive_overall]

  manifest:
    path: outputs/final/manifest.json
    stage: final
    view: all
    description: Selected model, reason, spec, features, backtest headline, validation status, file hashes.
    format: json
    required_keys: [selected_model, selection_reason, spec, features, backtest, validation, files_sha256_16]

  validation_report:
    path: outputs/final/validation_report.json
    stage: final
    view: all
    format: json
    required_keys: [status, checks, facts]

  experiment_registry:
    path: artifacts/registry/registry.csv
    stage: backtest experiments
    view: accuracy
    description: Champion vs every challenger on identical folds, with promotion verdicts.
    primary_key: [experiment]
    columns:
      experiment: string
      description: string
      WAPE: float
      Bias: float
      MAE: float
      RMSE: float
      WAPE_1-3m: float
      WAPE_4-6m: float
      WAPE_7-12m: float
      WAPE_13-19m: float
      WAPE_family_month: float
      WAPE_total_month: float
      verdict: string

  horizon_reliability:
    path: artifacts/reports/horizon_reliability.csv
    stage: robustness
    view: accuracy
    primary_key: [h]
    columns:
      h: int
      WAPE_series: float
      Bias_series: float
      WAPE_family_month: float
      WAPE_total_month: float

  reliability_tiers:
    path: artifacts/reports/reliability_tiers.csv
    stage: robustness
    view: accuracy
    primary_key: [Tier]
    columns:
      Tier: string
      Series: int
      Volume_share: float
      Median_WAPE: float

  macro_stress:
    path: artifacts/reports/macro_stress.csv
    stage: robustness
    view: planning
    primary_key: [Scenario]
    columns:
      Scenario: string
      Total_19m: int
      Total_vs_base_pct: float

  series_signals:
    path: outputs/intelligence/series_signals.csv
    stage: intelligence
    view: planning
    description: Per SKU x Region status, risk, reasons and recommendation.
    primary_key: [SKU_ID, Region]
    columns:
      SKU_ID: string
      Region: string
      Product_Family: string
      Customer_Name: string
      hist_last12: float
      fc_next12: float
      p10_next12: float
      p90_next12: float
      forecast_change_vs_last12: float
      growth_3m_yoy: float
      backtest_wape: float
      forecast_status: string           # HIGH_GROWTH | GROWTH | STABLE | DECLINE | SHARP_DECLINE | RAMPING | NEW_LAUNCH | END_OF_LIFE
      sustained_surge: bool
      sustained_decline: bool
      risk_score: float                 # 0..100
      risk_level: string                # HIGH | MEDIUM | LOW
      reason_codes: string              # "|"-separated codes
      recommendation: string
      p90_next6_planning: float         # suggested 6-month planning quantity

  exceptions:
    path: outputs/intelligence/exceptions.csv
    stage: intelligence
    view: planning
    description: Ranked planner exception list.
    primary_key: [SKU_ID, Region]
    columns:
      SKU_ID: string
      Region: string
      tier: string                      # ACT_NOW | REVIEW
      trigger: string
      priority_score: float
      units_at_stake_next12: float
      reason_codes: string
      recommendation: string

  market_signals:
    path: outputs/intelligence/market_signals.csv
    stage: intelligence
    view: planning
    primary_key: [Level, Member]
    columns:
      Level: string
      Member: string
      yoy_last3m: float
      yoy_last12m: float
      acceleration: float
      forecast_next12_vs_last12: float
      signal: string

  lifecycle_alerts:
    path: outputs/intelligence/lifecycle_alerts.csv
    stage: intelligence
    view: planning
    columns:
      Alert: string
      SKU_ID: string
      Date: month
      Detail: string

  interval_reliability:
    path: outputs/intelligence/interval_reliability.csv
    stage: intelligence
    view: accuracy
    primary_key: [Segment, Value]
    columns:
      Segment: string
      Value: string
      Rows: int
      Coverage_P10_P90: float

  intelligence_summary:
    path: outputs/intelligence/summary.json
    stage: intelligence
    view: planning
    format: json
    required_keys: [forecast_model, series, status_counts, risk_level_counts, exceptions, market_headline]

  anomaly_register:
    path: outputs/anomalies/anomaly_register.csv
    stage: anomalies
    view: anomalies
    description: Every flagged month - type, category, evidence and the action taken.
    columns:
      Date: month
      SKU_ID: string
      Region: string
      Product_Family: string
      Units_Shipped: float
      Demand: float
      Expected: float
      Type: string
      Category: string                  # stockout | spike | drop | real_event | gap | ...
      Detection: string
      Reason: string
      Action: string
      Confidence: string

  structural_register:
    path: outputs/anomalies/structural_register.csv
    stage: anomalies
    view: anomalies
    columns:
      Type: string
      Date: string                      # YYYY-MM, or YYYY for year-level ordering-cycle changes
      SKU_ID: string
      Region: string
      Detail: string
      Evidence: string
      Action: string

  event_impact:
    path: outputs/anomalies/event_impact.csv
    stage: anomalies
    view: anomalies
    primary_key: [Event_ID]
    columns:
      Event_ID: string
      Event_Type: string
      Description: string
      Shipped_Impact_Pct: float
      Demand_Impact_Pct: float
      Method: string
      Verdict: string

  dq_issue_log:
    path: outputs/quality/dq_issue_log.csv
    stage: clean
    view: data_quality
    description: Every data-quality correction (original -> corrected, rule applied).
    columns:
      file: string
      row_ref: string
      issue_type: string
      category: string
      field: string
      original: string
      corrected: string
      action: string
      rule: string

  dq_report:
    path: outputs/quality/dq_report.json
    stage: clean
    view: data_quality
    format: json

  run_report:
    path: outputs/quality/run_report.json
    stage: clean
    view: data_quality
    format: json
    required_keys: [validation_status]

  # ---------------------------------------------------------------- Milestone 3: planning intelligence
  intelligence_report:
    path: outputs/intelligence/intelligence_report.json
    stage: intelligence
    view: executive
    description: KPIs, executive briefing, top recommendations, segment matrix, capacity flags, market signals, scenario presets.
    format: json
    required_keys: [generated_at, kpis, briefing, top_recommendations, rule_counts, segment_matrix, capacity, market]

  recommendations:
    path: outputs/intelligence/recommendations.json
    stage: intelligence
    view: planning
    description: Every exception rendered as an action card (priority, owner, finding, action, trade-off, window, evidence).
    format: json

  timeline:
    path: outputs/intelligence/timeline.csv
    stage: intelligence
    view: executive
    description: Company units and revenue per month - history (shipped and unconstrained) into the forecast with P10/P90.
    primary_key: [Date]
    columns:
      Date: month
      Part: string                      # history | forecast
      Units_shipped: float
      Units_unconstrained: float
      Revenue_shipped: float
      Revenue_unconstrained: float
      Units_forecast: float
      Units_P10: float
      Units_P90: float
      Revenue_forecast: float
      Revenue_P10: float
      Revenue_P90: float

  mix:
    path: outputs/intelligence/mix.csv
    stage: intelligence
    view: executive
    primary_key: [Dimension, Member]
    columns:
      Dimension: string                 # Product_Family | Region | Sales_Channel
      Member: string
      Units_last12: float
      Revenue_last12: float
      Units_next12: float
      Revenue_next12: float
      Units_change_pct: float
      Revenue_change_pct: float

  price_book:
    path: outputs/intelligence/price_book.csv
    stage: intelligence
    view: executive
    primary_key: [SKU_ID]
    columns:
      SKU_ID: string
      Price_2026: float
      Price_source: string
      Price_2027: float
      Price_2028: float

  demand_signals:
    path: outputs/intelligence/demand_signals.csv
    stage: intelligence
    view: explorer
    description: Momentum, outlook, mix shift, seasonality and market-relative signal per family / region / family x region / customer / channel / powertrain.
    primary_key: [Level, Member]
    columns:
      Level: string
      Member: string
      YoY_last3m: float
      YoY_last12m: float
      Forecast_next12_vs_last12: float
      Mix_shift_pts: float
      Peak_months: string
      Direction: string                 # GROWING | STABLE | DECLINING
      Signal: string                    # OUTPACING_MARKET | LAGGING_MARKET | MIXED | IN_LINE | MARKET_*

  series_risk:
    path: outputs/intelligence/series_risk.csv
    stage: intelligence
    view: risk
    description: Per SKU x Region signals, risk components, value at risk, segment and confidence.
    primary_key: [SKU_ID, Region]
    columns:
      SKU_ID: string
      Region: string
      risk_score: float
      risk_level: string
      confidence: string                # HIGH | MEDIUM | LOW
      Segment: string
      revenue_next12: float
      revenue_downside_next12: float
      revenue_upside_next12: float
      forecast_anomaly: bool

  exceptions_ranked:
    path: outputs/intelligence/exceptions_ranked.csv
    stage: intelligence
    view: risk
    primary_key: [exception_id]
    columns:
      exception_id: string
      rule_id: string
      level: string
      scope: string
      severity: string
      impact_usd: float
      urgency_months: int
      confidence: string
      priority_score: float
      priority: string                  # CRITICAL | HIGH | MEDIUM
      evidence: string                  # JSON

  segmentation:
    path: outputs/intelligence/segmentation.csv
    stage: intelligence
    view: planning
    primary_key: [SKU_ID, Region]
    columns:
      SKU_ID: string
      Region: string
      Revenue_next12: float
      ABC: string
      XYZ: string
      Segment: string
      Service_level: float
      Planning_approach: string

  procurement_next_cycle:
    path: outputs/intelligence/procurement_next_cycle.csv
    stage: intelligence
    view: planning
    description: Deliveries in the next 3 months per SKU x Region at the segment's service level.
    primary_key: [SKU_ID, Region]
    columns:
      SKU_ID: string
      Region: string
      Segment: string
      Leadtime_P50: float
      Leadtime_cover: float
      Safety_buffer: float
      Cover_value_usd: float

  procurement_plan:
    path: outputs/intelligence/procurement_plan.csv
    stage: intelligence
    view: planning
    description: Procurement plan from P90 forecasts - per SKU x Region x delivery month.
    primary_key: [Date, SKU_ID, Region]
    columns:
      Date: month
      SKU_ID: string
      Region: string
      Forecast: float
      P50: float
      P90: float
      Leadtime_cover: float
      Safety_buffer: float
      Order_release_month: string

  capacity_check:
    path: outputs/intelligence/capacity_check.csv
    stage: intelligence
    view: planning
    primary_key: [Product_Family, Region]
    columns:
      Product_Family: string
      Region: string
      Demonstrated_3m_throughput: float
      Peak_3m_load_P50: float
      Peak_3m_load_P90: float
      Utilisation_P50: float
      Utilisation_P90: float
      Capacity_flag: string

  supply_risk:
    path: outputs/intelligence/supply_risk.csv
    stage: intelligence
    view: planning
    primary_key: [Product_Family, Region]
    columns:
      Product_Family: string
      Region: string
      Shortage_months_36m: float
      Lost_units_36m: float
      Supply_risk_score: float
      Supply_risk_level: string

  scenario_presets:
    path: outputs/intelligence/scenario_presets.json
    stage: intelligence
    view: scenario
    format: json
    required_keys: ["Base case", "Downside", "Upside", "PMI -3"]

  emulator_validation:
    path: artifacts/scenarios/emulator_validation.csv
    stage: scenario simulations
    view: scenario
    primary_key: [scenario_id]

  # ---------------------------------------------------------------- Milestone 3: macro drivers
  lead_lag:
    path: outputs/drivers/lead_lag.csv
    stage: drivers
    view: macro_drivers
    description: Pearson r between each macro indicator and each product family at lags 0-12 months (post-COVID).
    primary_key: [Product_Family, Indicator, Lag]
    columns:
      Product_Family: string
      Indicator: string
      Lag: int
      Corr: float
      N: int

  best_lags:
    path: outputs/drivers/best_lags.csv
    stage: drivers
    view: macro_drivers
    description: Champion lag (highest |r|) per product family x indicator pair.
    primary_key: [Product_Family, Indicator]
    columns:
      Product_Family: string
      Indicator: string
      Lag: int
      Corr: float
      N: int

  lag_stability:
    path: outputs/drivers/lag_stability.csv
    stage: drivers
    view: macro_drivers
    description: Lag stability check - 2021-23 vs 2024-26 half-period comparison.
    primary_key: [Product_Family, Indicator]
    columns:
      Product_Family: string
      Indicator: string
      Lag_2021_23: int
      Corr_2021_23: float
      Lag_2024_26: int
      Corr_2024_26: float
      Lag_Shift: int
      Stable: bool

  ev_shift:
    path: outputs/drivers/ev_shift.json
    stage: drivers
    view: macro_drivers
    description: EV vs ICE powertrain share by year 2019-2026 and correlation with EV adoption index.
    format: json
    required_keys: [ev_share_pct_by_year, ice_share_pct_by_year, corr_ev_index_vs_ev_share]
    columns:
      scenario_id: string
      total_sim_pct: float
      total_emulated_pct: float
      total_abs_err_pts: float

  sku_lifecycle:
    path: outputs/intelligence/sku_lifecycle.csv
    stage: intelligence
    view: explorer
    description: Product master with lifecycle status, launch / EOL dates, predecessor and successor.
    primary_key: [SKU_ID]
    columns:
      SKU_ID: string
      Product_Family: string
      SKU_Description: string
      Size_Class: string
      Powertrain_Application: string    # ICE | EV | Universal
      Launch_Date: month
      EOL_Date: month
      Replaces_SKU: string
      Successor_SKU: string
      Lifecycle_Status: string          # Active | Discontinued | EOL Announced | Planned Launch

  series_profile:
    path: outputs/intelligence/series_profile.csv
    stage: intelligence
    view: explorer
    description: Per SKU x Region demand profile - history span, ordering cycle, intermittency (ADI, CV2) and demand class.
    primary_key: [SKU_ID, Region]
    columns:
      SKU_ID: string
      Region: string
      First_Month: month
      Last_Month: month
      Months: int
      Cycle_Last12: float               # typical months between orders
      Nonzero_Share_24: float
      ADI: float
      CV2: float
      Demand_Class: string              # smooth | intermittent | erratic | lumpy

