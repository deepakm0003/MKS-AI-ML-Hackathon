# Experiment registry definitions. Every experiment runs under IDENTICAL conditions:
# same cleaned demand panel, same cutoffs, same 19-month horizon, same metrics.
# Only the keys listed under an experiment differ from `champion`.

evaluation:
  # 6 rolling origins, 6 months apart; each forecasts the next 19 months
  cutoffs: ["2022-10", "2023-04", "2023-10", "2024-04", "2024-10", "2025-03"]
  # cutoffs that were used (lightly) for tuning before the champion was frozen
  tuned_on: ["2024-04", "2025-03"]
  horizon_buckets: [[1, 3], [4, 6], [7, 12], [13, 19]]
  promotion:
    # a challenger replaces the champion only if it is better on average AND stable
    min_mean_wape_gain: 0.002          # absolute WAPE points
    min_share_cutoffs_won: 0.67        # wins on at least 4 of 6 cutoffs
    max_single_cutoff_loss: 0.005      # never worse than this on any cutoff
    max_bucket_loss: 0.003             # no horizon bucket (1-3/4-6/7-12/13-19 m) worse than this
    max_abs_bias_increase: 0.01        # |bias| may not grow by more than 1 point
    max_segment_loss: 0.005            # no family, region or new-series segment worse than this

champion:
  description: "Global LightGBM, Tweedie loss on demand/scale, weight=scale, 87 features (frozen 2026-11-20)"
  model: lgb
  feature_set: base
  params:
    objective: tweedie
    tweedie_variance_power: 1.2
    learning_rate: 0.03
    num_leaves: 63
    min_data_in_leaf: 200
    feature_fraction: 0.7
    bagging_fraction: 0.8
    bagging_freq: 1
    lambda_l2: 1.0
    seed: 7
    deterministic: true
    force_row_wise: true
    num_threads: 16
    verbose: -1
  rounds: 1200
  train_first_origin: "2020-01"
  train_origin_step: 2
  target_clip: 20

experiments:
  # ---- milestone 1
  cross_series:
    description: "Champion + cross-series market features (family, region, customer, family x region, total)"
    feature_set: base+cross
  no_macro:
    description: "Champion without macro features (measures dependence on macro foresight)"
    drop_feature_prefix: ["m_"]
  # ---- phase C
  c1_growth:
    description: "C1: + series momentum, age-aware growth and family-specific macro sensitivity"
    feature_set: base+growth
  c2_horizon_split:
    description: "C2: separate models for h 1-6 and h 7-19"
    horizon_models: [[1, 6], [7, 19]]
  c3_interm_features:
    description: "C3a: + intermittent-demand statistics (ADI, CV2, TSB, SBA, overdue)"
    feature_set: base+interm
  c3_hurdle:
    description: "C3b: two-stage P(order) x E[qty | order], champion features"
    model: hurdle
  c3_hurdle_interm:
    description: "C3c: two-stage hurdle with intermittent-demand statistics"
    model: hurdle
    feature_set: base+interm
  c4_seed_bag_cross:
    description: "C4: champion + cross-series features, averaged over 3 seeds"
    feature_set: base+cross
    seeds: [7, 11, 23]
  c5_catboost:
    description: "C5: CatBoost, Tweedie, same leakage-safe features"
    model: catboost
    cb_iterations: 1000
  c6_no_ev_level:
    description: "C6: drop the EV-adoption features (stress test showed they act as a time-trend proxy)"
    drop_feature_prefix: ["m_EV_Adoptio"]
  c7_blend_lgb_catboost:
    description: "C7: 50/50 average of the champion (LightGBM) and C5 (CatBoost) forecasts - fixed weights, no fitting"
    blend:
      members: [champion, c5_catboost]
      weights: [0.5, 0.5]
  c8_blend_cross_catboost:
    description: "C8: 50/50 average of C4 (seed-bagged LightGBM + cross-series) and C5 (CatBoost) - fixed weights"
    blend:
      members: [c4_seed_bag_cross, c5_catboost]
      weights: [0.5, 0.5]
  c9a_no_training_exclusions:
    description: "C9a: train on every observed month (only missing months excluded); target unchanged"
    demand_variant: no_training_exclusions
  c9b_keep_event_months:
    description: "C9b: keep event-window and price pull-forward months in training; one-off orders still excluded"
    demand_variant: keep_event_months
  c9c_keep_pull_forward:
    description: "C9c: keep price pull-forward months in training; event windows and one-offs excluded"
    demand_variant: keep_pull_forward
  c9d_keep_event_windows:
    description: "C9d: keep event-window months in training; pull-forward months and one-offs excluded"
    demand_variant: keep_event_windows
  # ---- robustness (not promotion candidates on their own)
  seed_bag:
    description: "Champion averaged over 3 seeds"
    seeds: [7, 11, 23]
  origin_step1:
    description: "Champion trained on every origin month instead of every second"
    train_origin_step: 1
  # ---- T1: tuning wave 1 on top of C9c (same folds, same promotion rule vs c9c)
  t1_leaves127:
    description: "C9c + num_leaves 127, min_data_in_leaf 100"
    demand_variant: keep_pull_forward
    params: {num_leaves: 127, min_data_in_leaf: 100}
  t1_leaves255_slow:
    description: "C9c + num_leaves 255, min_data_in_leaf 300, lr 0.02, 2000 rounds"
    demand_variant: keep_pull_forward
    params: {num_leaves: 255, min_data_in_leaf: 300, learning_rate: 0.02}
    rounds: 2000
  t1_tweedie11:
    description: "C9c + Tweedie variance power 1.1"
    demand_variant: keep_pull_forward
    params: {tweedie_variance_power: 1.1}
  t1_tweedie135:
    description: "C9c + Tweedie variance power 1.35"
    demand_variant: keep_pull_forward
    params: {tweedie_variance_power: 1.35}
  t1_ff05_l2:
    description: "C9c + feature_fraction 0.5, lambda_l2 5"
    demand_variant: keep_pull_forward
    params: {feature_fraction: 0.5, lambda_l2: 5.0}
  t1_lr02_2000:
    description: "C9c + lr 0.02, 2000 rounds"
    demand_variant: keep_pull_forward
    params: {learning_rate: 0.02}
    rounds: 2000
  t1_leaves31_2000:
    description: "C9c + num_leaves 31, 2000 rounds"
    demand_variant: keep_pull_forward
    params: {num_leaves: 31}
    rounds: 2000
  t1_seedbag3:
    description: "C9c averaged over 3 seeds"
    demand_variant: keep_pull_forward
    seeds: [7, 11, 23]
  # ---- T2: wave 2 - blends of the two best training-month variants, new information features
  t2_c9b_seedbag3:
    description: "C9b averaged over 3 seeds"
    demand_variant: keep_event_months
    seeds: [7, 11, 23]
  t2_blend_c9c_c9b:
    description: "50/50 average of C9c and C9b (fixed weights)"
    blend:
      members: [c9c_keep_pull_forward, c9b_keep_event_months]
      weights: [0.5, 0.5]
  t2_blend_sb:
    description: "50/50 average of seed-bagged C9c and seed-bagged C9b (fixed weights)"
    blend:
      members: [t1_seedbag3, t2_c9b_seedbag3]
      weights: [0.5, 0.5]
  t2_price:
    description: "C9c + announced price-change features (next / last January rise, months to rise, surcharge)"
    demand_variant: keep_pull_forward
    feature_set: base+price
  t2_cross_c9c:
    description: "C9c training months + cross-series (family / customer) features"
    demand_variant: keep_pull_forward
    feature_set: base+cross
  t2_cross_price:
    description: "C9c + cross-series + price-change features"
    demand_variant: keep_pull_forward
    feature_set: base+cross+price
  t2_blend_cross_c9b:
    description: "50/50 average of t2_cross_c9c and C9b (fixed weights)"
    blend:
      members: [t2_cross_c9c, c9b_keep_event_months]
      weights: [0.5, 0.5]
  t2_blend_cross_c9c:
    description: "50/50 average of t2_cross_c9c and C9c (fixed weights)"
    blend:
      members: [t2_cross_c9c, c9c_keep_pull_forward]
      weights: [0.5, 0.5]
  t2_blend_cross_sb:
    description: "50/50 average of t2_cross_c9c and seed-bagged C9b (fixed weights)"
    blend:
      members: [t2_cross_c9c, t2_c9b_seedbag3]
      weights: [0.5, 0.5]
  t2_blend_three:
    description: "Equal average of t2_cross_c9c, C9c and C9b (fixed weights)"
    blend:
      members: [t2_cross_c9c, c9c_keep_pull_forward, c9b_keep_event_months]
      weights: [0.3334, 0.3333, 0.3333]
  t3_cross_c9b:
    description: "C9b training months + cross-series features"
    demand_variant: keep_event_months
    feature_set: base+cross
  t3_blend_cross_both:
    description: "50/50 average of t2_cross_c9c and t3_cross_c9b (fixed weights)"
    blend:
      members: [t2_cross_c9c, t3_cross_c9b]
      weights: [0.5, 0.5]
